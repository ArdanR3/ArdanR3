name: GitHub Metrics

on:
  schedule:
    # Update otomatis setiap hari jam 08:00 WIB (01:00 UTC)
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate AniList Anime SVG
        uses: lowlighter/metrics@latest
        with:
          filename: assets/anilist-anime.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ArdanR3
          template: classic
          base: ""
          config_twemoji: true
          plugin_anilist: yes
          plugin_anilist_user: ArdanR3
          plugin_anilist_medias: anime
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 4

      - name: Generate AniList Manga SVG
        uses: lowlighter/metrics@latest
        with:
          filename: assets/anilist-manga.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ArdanR3
          template: classic
          base: ""
          config_twemoji: true
          plugin_anilist: yes
          plugin_anilist_user: ArdanR3
          plugin_anilist_medias: manga
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 4

      - name: Generate AniList Characters SVG
        uses: lowlighter/metrics@latest
        with:
          filename: assets/anilist-characters.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: ArdanR3
          template: classic
          base: ""
          config_twemoji: true
          plugin_anilist: yes
          plugin_anilist_user: ArdanR3
          plugin_anilist_sections: characters
          plugin_anilist_limit: 24
          plugin_anilist_shuffle: no
